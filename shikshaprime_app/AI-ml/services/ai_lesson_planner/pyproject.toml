[project]
name = "ai-lesson-planner"
version = "0.1.0"
description = "AI generation layer for structured lesson plan creation using LangGraph + Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "google-genai>=1.75.0",
    "langgraph>=1.1.10",
    "pydantic>=2.13.3",
    "pypdf>=6.11.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that call the real Gemini API (deselect with -m 'not integration')",
]
