name: Deploy Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_SERVER_HOST }}
          username: ${{ secrets.DEPLOY_SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/shikshaprime-college/ShikshaPrime_new/college-management-system-frontend
            git pull origin main

            # Clean up old installs and lockfile
            rm -rf node_modules package-lock.json

            # Install dependencies fresh
            npm install --force

            # Load environment variables from .env.production
            export $(grep -v '^#' .env.production | xargs)

            # Debug: Print variables to confirm they are loaded
            echo "NEXT_PUBLIC_BASE_PATH=$NEXT_PUBLIC_BASE_PATH"
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
            echo "NEXT_PUBLIC_ENV=$NEXT_PUBLIC_ENV"
            echo "PORT=$PORT"

            # Build Next.js app in production mode with env vars injected
            NODE_ENV=production npm run build

            # Start using ecosystem config
            pm2 delete college-mainapp || true 
            pm2 start ecosystem.config.js --only college-mainapp --update-env 
            pm2 save