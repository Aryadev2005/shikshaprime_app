openapi: 3.0.0
info:
  title: Student Service API
  description: Comprehensive API documentation for Student Service in ShikshaPrime College Management System.
  version: 1.0.0

servers:
  - url: /
    description: Current host environment

tags:
  - name: Health
    description: Health check and readiness endpoints
  - name: Students
    description: Student profile management, search, lookups, and statistics
  - name: Attendance
    description: Daily student attendance, bulk marking, OCR attendance sheet upload, and reports
  - name: Session Attendance
    description: Class routine session-based attendance, bulk submissions, heatmap stats, and 3-day correction workflows
  - name: Assignments
    description: Student assignment statistics, submission, filtering, and file serving
  - name: Learning Materials
    description: Learning material uploads, student downloads, and course material management
  - name: Notifications
    description: Student notification management, read status, and clear operations
  - name: Hierarchy
    description: Academic hierarchy metadata (departments, programs, classes, semesters, subjects, academic years)
  - name: Department Hierarchy
    description: Department tree structure and subject mappings

components:
  securitySchemes:
    tenantHeader:
      type: apiKey
      in: header
      name: x-tenant
      description: Tenant identifier (e.g. demo, test)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token for authenticated requests

  schemas:
    GenericResponse:
      type: object
      properties:
        status:
          oneOf:
            - type: string
              example: success
            - type: integer
              example: 1
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
          additionalProperties: true
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        status:
          oneOf:
            - type: string
              example: error
            - type: integer
              example: 0
        message:
          type: string
          example: An error occurred
        data:
          type: object
          nullable: true
      additionalProperties: true

    StudentSubjectItem:
      type: object
      properties:
        subject_id:
          type: integer
          example: 1
        is_core:
          type: boolean
          example: true

    StudentCreateRequest:
      type: object
      required:
        - registration_id
        - section
        - semester
      properties:
        registration_id:
          type: string
          example: REG-20260526-1234
        section:
          type: string
          example: A
        semester:
          type: integer
          example: 1
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/StudentSubjectItem'
      additionalProperties: true

    StudentUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        mobile:
          type: string
          example: "9876543210"
        email:
          type: string
          example: john.doe@example.com
        address_line:
          type: string
          example: 123 North Hall Street
        city:
          type: string
          example: Bangalore
        state:
          type: string
          example: Karnataka
        pin_code:
          type: string
          example: "560001"
        semester_id:
          type: integer
          example: 2
        class_id:
          type: integer
          example: 1
      additionalProperties: true

    AttendanceMarkRequest:
      type: object
      required:
        - student_id
        - attendance_date
        - attendance_status
      properties:
        student_id:
          type: integer
          example: 1
        student_code:
          type: string
          example: STU-2026001
        student_name:
          type: string
          example: John Doe
        attendance_date:
          type: string
          format: date
          example: "2026-08-22"
        attendance_status:
          type: string
          enum: [PRESENT, ABSENT, LATE, HALF_DAY, HOLIDAY, LEAVE, ON_DUTY]
          example: PRESENT
        check_in_time:
          type: string
          example: "09:00:00"
        check_out_time:
          type: string
          example: "16:00:00"
        late_minutes:
          type: integer
          example: 0
        attendance_type:
          type: string
          enum: [MANUAL, BIOMETRIC, RFID, MOBILE_APP]
          example: MANUAL
        marked_by:
          type: string
          example: TEACHER
        remarks:
          type: string
          example: Present in morning session
      additionalProperties: true

    AttendanceBulkItem:
      type: object
      required:
        - student_id
        - status
      properties:
        student_id:
          type: integer
          example: 1
        student_code:
          type: string
          example: STU-2026001
        student_name:
          type: string
          example: John Doe
        status:
          type: string
          enum: [PRESENT, ABSENT, LATE, HALF_DAY, HOLIDAY, LEAVE, ON_DUTY]
          example: PRESENT

    AttendanceBulkRequest:
      type: object
      required:
        - date
        - students
      properties:
        date:
          type: string
          format: date
          example: "2026-08-22"
        marked_by:
          type: string
          example: TEACHER
        students:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceBulkItem'

    AssignmentSubmitRequest:
      type: object
      required:
        - teacherAssignmentId
      properties:
        teacherAssignmentId:
          type: integer
          example: 1
        submissionText:
          type: string
          example: Attached completed report and code submission for Assignment 1.

    LearningMaterialCreateRequest:
      type: object
      required:
        - title
        - subject_id
      properties:
        title:
          type: string
          example: Unit 1 Lecture Notes - Data Structures
        description:
          type: string
          example: Comprehensive lecture slides and code examples on Trees and Graphs.
        department_id:
          type: integer
          example: 1
        program_id:
          type: integer
          example: 1
        academic_year_id:
          type: integer
          example: 1
        class_id:
          type: integer
          example: 1
        semester_id:
          type: integer
          example: 1
        subject_id:
          type: integer
          example: 1
        material_type:
          type: string
          enum: [document, video, presentation, syllabus, notes]
          example: document

    LearningMaterialUpdateRequest:
      type: object
      properties:
        title:
          type: string
          example: Unit 1 Lecture Notes - Data Structures (Updated)
        description:
          type: string
          example: Updated slides with extra practice problems.
        department_id:
          type: integer
          example: 1
        program_id:
          type: integer
          example: 1
        academic_year_id:
          type: integer
          example: 1
        class_id:
          type: integer
          example: 1
        semester_id:
          type: integer
          example: 1
        subject_id:
          type: integer
          example: 1
        material_type:
          type: string
          example: document

    SessionStartRequest:
      type: object
      required:
        - routine_entry_id
      properties:
        routine_entry_id:
          type: integer
          example: 101
        attendance_date:
          type: string
          format: date
          example: "2026-08-22"

    SessionSubmitStudentItem:
      type: object
      required:
        - student_id
        - attendance_status
      properties:
        student_id:
          type: integer
          example: 1
        attendance_status:
          type: string
          enum: [PRESENT, ABSENT]
          example: PRESENT

    SessionSubmitRequest:
      type: object
      required:
        - attendance_session_id
        - students
      properties:
        attendance_session_id:
          type: integer
          example: 1
        students:
          type: array
          items:
            $ref: '#/components/schemas/SessionSubmitStudentItem'

    CorrectionSubmitItem:
      type: object
      required:
        - student_id
        - attendance_status
        - correction_reason
      properties:
        student_attendance_id:
          type: integer
          example: 10
        student_id:
          type: integer
          example: 1
        attendance_status:
          type: string
          enum: [PRESENT, ABSENT]
          example: PRESENT
        correction_reason:
          type: string
          example: Student was present in lab session; initially marked absent by mistake.

    CorrectionSubmitRequest:
      type: object
      required:
        - attendance_session_id
        - corrections
      properties:
        attendance_session_id:
          type: integer
          example: 1
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/CorrectionSubmitItem'

    CorrectionSingleStudentRequest:
      type: object
      required:
        - attendance_status
        - correction_reason
      properties:
        attendance_status:
          type: string
          enum: [PRESENT, ABSENT]
          example: PRESENT
        correction_reason:
          type: string
          example: Student was present; correction approved after verification.

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns health status of the student service.
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: Service is healthy

  /api/student/ready/{tenant}:
    get:
      tags:
        - Health
      summary: Database readiness check for tenant
      description: Verifies database connectivity and readiness breaker status for the specified tenant.
      parameters:
        - in: path
          name: tenant
          required: true
          schema:
            type: string
          description: Tenant name (e.g. demo)
          example: demo
      responses:
        '200':
          description: Service is ready
          content:
            text/plain:
              schema:
                type: string
                example: READY
        '500':
          description: Service is not ready
          content:
            text/plain:
              schema:
                type: string
                example: NOT READY

  /api/student:
    get:
      tags:
        - Students
      summary: Get all students
      description: Lists all students in the tenant.
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Students fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized

  /api/student/search:
    get:
      tags:
        - Students
      summary: Search students with filters
      description: Search students by query, roll number, student name, email, department, class, academic year, or status.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          schema:
            type: string
          description: General search keyword
          example: John
        - in: query
          name: roll_number
          schema:
            type: string
          description: Filter by roll number
          example: "CS2026001"
        - in: query
          name: student_name
          schema:
            type: string
          description: Filter by student name
          example: "John Doe"
        - in: query
          name: email
          schema:
            type: string
          description: Filter by student email
          example: "john.doe@example.com"
        - in: query
          name: department_id
          schema:
            type: integer
          description: Filter by department ID
          example: 1
        - in: query
          name: class_id
          schema:
            type: integer
          description: Filter by class ID
          example: 1
        - in: query
          name: academic_year
          schema:
            type: string
          description: Filter by academic year name
          example: "2026-2027"
        - in: query
          name: status
          schema:
            type: string
          description: Filter by status
          example: active
      responses:
        '200':
          description: Student search completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized

  /api/student/statistics:
    get:
      tags:
        - Students
      summary: Get student statistics
      description: Returns overall student statistics (Requires admin role).
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Statistics fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin role required

  /api/student/payment-lookup:
    get:
      tags:
        - Students
      summary: Lookup student details for payment
      description: Lookup student academic and fee payment records by student_id or university_registration_number and payment_type_id.
      security:
        - tenantHeader: []
      parameters:
        - in: query
          name: identifier
          required: true
          schema:
            type: string
          description: Student ID code or University Registration Number
          example: "STU-2026001"
        - in: query
          name: lookupType
          required: false
          schema:
            type: string
            enum: [student_id, registration]
            default: student_id
          description: Type of identifier provided
          example: student_id
        - in: query
          name: paymentTypeId
          required: true
          schema:
            type: integer
          description: Payment type ID
          example: 1
      responses:
        '200':
          description: Student payment details fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Bad request - Missing parameters
        '404':
          description: Student or payment type not found

  /api/student/by-student-id/{student_id}:
    get:
      tags:
        - Students
      summary: Get student by student code/ID string
      description: Returns student record matching the string student code (e.g. STU-2026001).
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: student_id
          required: true
          schema:
            type: string
          description: Student string identifier code
          example: "STU-2026001"
      responses:
        '200':
          description: Student fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized
        '404':
          description: Student not found

  /api/student/by-department/{department_id}:
    get:
      tags:
        - Students
      summary: Get students by department ID
      description: Lists all students belonging to the specified department.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: department_id
          required: true
          schema:
            type: integer
          description: Department ID
          example: 1
      responses:
        '200':
          description: Students fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized

  /api/student/by-class:
    get:
      tags:
        - Students
      summary: Get students by class, program, and academic year
      description: Lists students enrolled in a specific class and program combination.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: query
          name: classId
          required: false
          schema:
            type: integer
          description: Class ID
          example: 1
        - in: query
          name: programId
          required: false
          schema:
            type: integer
          description: Program ID
          example: 1
        - in: query
          name: academicYearId
          required: false
          schema:
            type: integer
          description: Academic Year ID
          example: 1
      responses:
        '200':
          description: Students fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized

  /api/student/by-academic-year/{academic_year_id}:
    get:
      tags:
        - Students
      summary: Get students by academic year ID
      description: Lists students for a given academic year.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: academic_year_id
          required: true
          schema:
            type: integer
          description: Academic Year ID
          example: 1
      responses:
        '200':
          description: Students fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized

  /api/student/details:
    get:
      tags:
        - Students
      summary: Get student details by email
      description: Fetch student details by email query parameter.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
          description: Student email address
          example: "john.doe@example.com"
      responses:
        '200':
          description: Student details fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Email not provided
        '401':
          description: Unauthorized
        '404':
          description: Student not found

  /api/student/me:
    get:
      tags:
        - Students
      summary: Get authenticated student profile bundle
      description: Returns the complete student profile bundle for the logged-in student (Requires student role).
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Complete student profile fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Student role required

  /api/student/me/contact:
    get:
      tags:
        - Students
      summary: Get authenticated student contact information
      description: Returns address, phone, and guardian contact details for the logged-in student (Requires student role).
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Contact information fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/student/me/academics:
    get:
      tags:
        - Students
      summary: Get authenticated student academic details
      description: Returns degree, program, department, and assigned subjects for the logged-in student (Requires student role).
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Academic details fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/student/me/details:
    get:
      tags:
        - Students
      summary: Get authenticated student record details
      description: Returns mapped student record for the logged-in student (Requires student role).
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Student details fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/student/me/dashboard:
    get:
      tags:
        - Students
      summary: Get authenticated student dashboard summary
      description: Returns aggregated dashboard metrics, attendance rates, routine summaries, and assignments (Requires student role).
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Student dashboard fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/student/{id}/contact:
    get:
      tags:
        - Students
      summary: Get student contact by student ID
      description: Returns contact information for a specific student ID.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Student ID (Primary Key)
          example: 1
      responses:
        '200':
          description: Contact information fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Invalid student ID
        '401':
          description: Unauthorized

  /api/student/{id}/academics:
    get:
      tags:
        - Students
      summary: Get student academic information by student ID
      description: Returns academic details and subject lists for a specific student ID.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Student ID (Primary Key)
          example: 1
      responses:
        '200':
          description: Academic details fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Invalid student ID
        '401':
          description: Unauthorized

  /api/student/{id}/profile:
    get:
      tags:
        - Students
      summary: Get student core profile by ID
      description: Returns core biographical profile for a specific student ID.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Student ID (Primary Key)
          example: 1
      responses:
        '200':
          description: Student core profile fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Invalid student ID
        '401':
          description: Unauthorized

  /api/student/{id}:
    get:
      tags:
        - Students
      summary: Get student by ID
      description: Returns student record by database ID.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Student ID (Primary Key)
          example: 1
      responses:
        '200':
          description: Student fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Invalid student ID
        '401':
          description: Unauthorized
        '404':
          description: Student not found
    put:
      tags:
        - Students
      summary: Update student by ID
      description: Update student profile details (Requires admin role).
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Student ID
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: Student updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    patch:
      tags:
        - Students
      summary: Partial update student by ID
      description: Partially update student details (Requires admin or teacher role).
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Student ID
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: Student updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    delete:
      tags:
        - Students
      summary: Delete student by ID
      description: Delete student record by ID (Requires admin role).
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Student ID
          example: 1
      responses:
        '200':
          description: Student deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Student not found

  /api/student/attendance:
    post:
      tags:
        - Attendance
      summary: Mark attendance for a single student
      description: Records daily attendance for an individual student.
      security:
        - tenantHeader: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceMarkRequest'
      responses:
        '201':
          description: Attendance marked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Empty or invalid request body
        '401':
          description: Unauthorized

  /api/student/attendance/bulk:
    post:
      tags:
        - Attendance
      summary: Bulk mark student attendance
      description: Marks or overwrites attendance for a list of students on a specific date.
      security:
        - tenantHeader: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceBulkRequest'
      responses:
        '200':
          description: Attendance marked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
