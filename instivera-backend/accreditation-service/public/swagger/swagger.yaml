openapi: 3.0.0
info:
  title: Accreditation Service API
  description: API documentation for the Accreditation Service.
  version: 1.0.0

servers:
  - url: /
    description: Uses the same host and port as the running service

tags:
  - name: Service
  - name: Institutional Identity
  - name: Academic
  - name: Research
  - name: Student Support
  - name: Institutional Values
  - name: Infrastructure

components:
  securitySchemes:
    tenantHeader:
      type: apiKey
      in: header
      name: x-tenant
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GenericResponse:
      type: object
      additionalProperties: true
    MultipartRequest:
      type: object
      additionalProperties: true
    PathId:
      type: integer
      minimum: 1

paths:
  /:
    get:
      tags:
        - Service
      summary: Get accreditation service status
      responses:
        '200':
          description: Accreditation service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /health:
    get:
      tags:
        - Service
      summary: Health check
      responses:
        '200':
          description: Health check passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

