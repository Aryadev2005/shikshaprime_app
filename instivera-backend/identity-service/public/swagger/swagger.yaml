openapi: 3.0.0
info:
  title: Identity & Access Management Service API
  description: Comprehensive API documentation for Identity, Authentication, RBAC (Role-Based Access Control), Class Routines & Timetable Scheduling, Multi-Gateway Payments (PhonePe, Razorpay), Academic Structure, and Notices in ShikshaPrime College Management System.
  version: 1.0.0

servers:
  - url: /
    description: Current host environment

tags:
  - name: Health
    description: Service health and tenant DB circuit breaker checks
  - name: Institutions
    description: Master tenant college & institution discovery
  - name: Auth & Account
    description: User authentication, JWT sessions, OTP verification, and password recovery
  - name: Academic Masters
    description: Academic years, departments, classes, degree programs, subjects, and fee structures
  - name: Teacher Portal
    description: Teacher assigned classes, programs, and academic schedules
  - name: Admin Dashboard
    description: Administrative identity metrics and statistics
  - name: Notices & Bulletins
    description: College-wide and departmental notices, announcements, and attachment documents
  - name: Phone OTP
    description: SMS OTP verification for student and staff mobile numbers
  - name: PhonePe Payments
    description: PhonePe payment gateway integration, order creation, webhooks, and status checks
  - name: Razorpay Payments
    description: Razorpay order generation and payment signature verification
  - name: Class Routines
    description: Timetable scheduling, automated conflict validation, teacher/student schedules, and routine CRUD
  - name: RBAC & Permissions
    description: Role-Based Access Control, role creation, user role mappings, module permissions, and granular action grants

components:
  securitySchemes:
    tenantHeader:
      type: apiKey
      in: header
      name: x-tenant
      description: Tenant identifier (e.g. demo, test)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token for authenticated requests

  schemas:
    GenericResponse:
      type: object
      properties:
        status:
          type: integer
          example: 1
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
          nullable: true
          additionalProperties: true
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 0
        message:
          type: string
          example: "An error occurred"
      additionalProperties: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: "admin@shikshaprime.com"
        password:
          type: string
          format: password
          example: "Admin@123"

    ValidateEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "student@example.com"

    EmailOtpRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "student@example.com"

    VerifyEmailOtpRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: "student@example.com"
        otp:
          type: string
          example: "123456"

    ChangePasswordRequest:
      type: object
      required:
        - email
        - password
        - confirmPassword
        - otp
      properties:
        email:
          type: string
          format: email
          example: "student@example.com"
        password:
          type: string
          format: password
          example: "NewSecurePassword#2026"
        confirmPassword:
          type: string
          format: password
          example: "NewSecurePassword#2026"
        otp:
          type: string
          example: "123456"

    SendOtpRequest:
      type: object
      required:
        - phone_number
      properties:
        phone_number:
          type: string
          example: "9876543210"

    VerifyOtpRequest:
      type: object
      required:
        - phone_number
        - otp
      properties:
        phone_number:
          type: string
          example: "9876543210"
        otp:
          type: string
          example: "123456"

    PhonePeInitiateRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          example: 25000.00
        merchantTransactionId:
          type: string
          example: "TXN_20260822_001"
        redirectUrl:
          type: string
          example: "https://portal.shikshaprime.com/payment-success"
        callbackUrl:
          type: string
          example: "https://api.shikshaprime.com/api/identity/payments/phonepe/webhook"
        mobileNumber:
          type: string
          example: "9876543210"
      additionalProperties: true

    RazorpayOrderRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          example: 15000.00
        currency:
          type: string
          default: "INR"
          example: "INR"
        receipt:
          type: string
          example: "rcpt_2026_001"
      additionalProperties: true

    RazorpayVerifyRequest:
      type: object
      required:
        - razorpay_order_id
        - razorpay_payment_id
        - razorpay_signature
      properties:
        razorpay_order_id:
          type: string
          example: "order_DBJOWzybf0sJbb"
        razorpay_payment_id:
          type: string
          example: "pay_29QQoUBi66xm2f"
        razorpay_signature:
          type: string
          example: "9ef4dffbfdbf40242a5c395ceadd82c4202084716423cf8e3ff9733f373e236a"

    RoutineEntryRequest:
      type: object
      required:
        - day_of_week
        - start_time
        - end_time
        - subject_id
        - teacher_id
      properties:
        day_of_week:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
          example: "MONDAY"
        start_time:
          type: string
          example: "09:00"
        end_time:
          type: string
          example: "10:00"
        subject_id:
          type: integer
          example: 101
        teacher_id:
          type: integer
          example: 12
        room_number:
          type: string
          nullable: true
          example: "Room 304"
        period_number:
          type: integer
          nullable: true
          example: 1

    CreateRoutineRequest:
      type: object
      required:
        - routine_number
        - title
        - effective_date
        - class_id
        - academic_year_id
      properties:
        routine_number:
          type: string
          example: "ROUT-CSE-2026-A"
        title:
          type: string
          example: "CSE 3rd Year Section A Weekly Routine"
        effective_date:
          type: string
          format: date
          example: "2026-08-01"
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT]
          default: ACTIVE
          example: "ACTIVE"
        class_id:
          type: integer
          example: 3
        academic_year_id:
          type: integer
          example: 2
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RoutineEntryRequest'

    ValidateConflictsRequest:
      type: object
      required:
        - entries
      properties:
        class_id:
          type: integer
          example: 3
        exclude_routine_id:
          type: integer
          nullable: true
          example: 1
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RoutineEntryRequest'

    CreateRoleRequest:
      type: object
      required:
        - roleName
      properties:
        roleName:
          type: string
          example: "ACADEMIC_COORDINATOR"
        description:
          type: string
          nullable: true
          example: "Oversees curriculum, schedules, and faculty assignments"

    UpdateRoleRequest:
      type: object
      properties:
        roleName:
          type: string
          example: "SENIOR_ACADEMIC_COORDINATOR"
        description:
          type: string
          example: "Updated role description"

    AssignRolesToUserRequest:
      type: object
      required:
        - roleIds
      properties:
        roleIds:
          type: array
          items:
            type: integer
          example: [2, 5]

    AssignUsersToRoleRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          items:
            type: integer
          example: [10, 15, 22]

    AssignPermissionsToRoleRequest:
      type: object
      required:
        - permissionIds
      properties:
        permissionIds:
          type: array
          items:
            type: integer
          example: [101, 102, 103, 104]

    AssignModulePermissionsRequest:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: object
            required:
              - module_id
              - can_read
              - can_write
              - can_delete
            properties:
              module_id:
                type: integer
                example: 1
              can_read:
                type: boolean
                example: true
              can_write:
                type: boolean
                example: true
              can_delete:
                type: boolean
                example: false

    RoleAndModulePermissionsRequest:
      type: object
      required:
        - roleId
      properties:
        roleId:
          type: integer
          example: 2
        modulePermissions:
          type: array
          items:
            type: object
            properties:
              module_id:
                type: integer
              can_read:
                type: boolean
              can_write:
                type: boolean
              can_delete:
                type: boolean

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns health status of the Identity service.
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "Service is healthy"

  /api/identity/ready/{tenant}:
    get:
      tags:
        - Health
      summary: Check tenant database readiness
      description: Tests database connectivity and circuit breaker status for a specific tenant.
      parameters:
        - in: path
          name: tenant
          required: true
          schema:
            type: string
          example: "demo"
      responses:
        '200':
          description: Tenant database is ready
          content:
            text/plain:
              schema:
                type: string
                example: "READY"
        '500':
          description: Tenant database is not ready
          content:
            text/plain:
              schema:
                type: string
                example: "NOT READY"

  /api/identity/institutions:
    get:
      tags:
        - Institutions
      summary: List active institutions
      description: Returns directory of all registered colleges and institutions for multi-tenant mobile/web app selection.
      responses:
        '200':
          description: Institutions fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/authenticate-user:
    post:
      tags:
        - Auth & Account
      summary: Authenticate user login
      description: Authenticates user credentials and returns JWT bearer token along with profile and role metadata.
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Invalid username or password

  /api/identity/validate-email:
    post:
      tags:
        - Auth & Account
      summary: Validate email existence
      description: Checks if an email address is registered within the tenant database.
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateEmailRequest'
      responses:
        '200':
          description: Email validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/send-email-otp:
    post:
      tags:
        - Auth & Account
      summary: Send password reset OTP to email
      description: Dispatches a 6-digit OTP code to the user's email address for password reset.
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOtpRequest'
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/user-send-email-otp:
    post:
      tags:
        - Auth & Account
      summary: Send OTP to logged-in user email
      description: Sends an OTP to the email address associated with the authenticated user profile.
      security:
        - tenantHeader: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/verify-email-otp:
    post:
      tags:
        - Auth & Account
      summary: Verify email OTP
      description: Verifies the submitted OTP against the temporary token cache.
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailOtpRequest'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Invalid or expired OTP

  /api/identity/change-password:
    post:
      tags:
        - Auth & Account
      summary: Change / Reset password
      description: Updates user password with OTP verification validation.
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Password mismatch or invalid OTP

  /api/identity/sr/academic-years:
    get:
      tags:
        - Academic Masters
      summary: List academic years
      description: Returns active academic calendar years for registration and timetables.
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Academic years fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/sr/classes:
    get:
      tags:
        - Academic Masters
      summary: List classes / sections
      description: Returns all academic classes and sections.
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Classes fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/sr/departments:
    get:
      tags:
        - Academic Masters
      summary: List primary departments
      description: Returns top-level college academic departments.
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Departments fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/sr/departments/level-2:
    get:
      tags:
        - Academic Masters
      summary: List sub-departments (Level 2)
      description: Returns second-level specialized sub-departments.
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Sub-departments fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/sr/programs:
    get:
      tags:
        - Academic Masters
      summary: List degree programs
      description: Returns degree courses (e.g. B.Tech, BBA, M.Sc).
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Programs fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/sr/programs/subjects:
    get:
      tags:
        - Academic Masters
      summary: List program subjects
      description: Returns subjects mapped to specific academic degree programs.
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Program subjects fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/sr/programs/classes/semesters:
    get:
      tags:
        - Academic Masters
      summary: List class semesters
      description: Returns semester terms for a specific program class.
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Semesters fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/sr/programs/semesters:
    get:
      tags:
        - Academic Masters
      summary: List program semesters
      description: Returns all semester terms associated with degree programs.
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Program semesters fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/sr/fee-structure:
    get:
      tags:
        - Academic Masters
      summary: Get admission fee structure
      description: Returns tuition and admission fee breakdowns by program and quota.
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Fee structure fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/files/documents/{filename}:
    get:
      tags:
        - Notices & Bulletins
      summary: Download / View document
      description: Serves uploaded document attachment by filename.
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          example: "notice_1716382910.pdf"
      responses:
        '200':
          description: Document binary stream
        '404':
          description: Document not found

  /api/identity/teacher/classes:
    get:
      tags:
        - Teacher Portal
      summary: Get teacher assigned classes
      description: Returns classes assigned to the authenticated faculty member.
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Teacher classes fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/teacher/programs:
    get:
      tags:
        - Teacher Portal
      summary: Get teacher assigned programs
      description: Returns degree programs associated with the faculty member.
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Teacher programs fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/teacher/academic-years:
    get:
      tags:
        - Teacher Portal
      summary: Get teacher academic years
      description: Returns academic years for teacher coursework.
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Academic years fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/teacher/all-classes:
    get:
      tags:
        - Teacher Portal
      summary: Get all classes for faculty
      description: Returns all accessible classes across the institution for faculty role.
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Classes fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/dashboard/admin:
    get:
      tags:
        - Admin Dashboard
      summary: Get admin dashboard data
      description: Returns administrative KPIs, total users, faculty counts, student enrollment totals, and active sessions.
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Admin dashboard data fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/notice/all:
    get:
      tags:
        - Notices & Bulletins
      summary: List all notices
      description: Returns list of all published college announcements.
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Notices fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/notice/recent:
    get:
      tags:
        - Notices & Bulletins
      summary: List recent notices
      description: Returns most recent notices for dashboard feeds.
      security:
        - tenantHeader: []
        - bearerAuth: []
      responses:
        '200':
          description: Recent notices fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/notice/{id}:
    get:
      tags:
        - Notices & Bulletins
      summary: Get notice by ID
      description: Returns full notice content with attachment metadata.
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Notice fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '404':
          description: Notice not found
    delete:
      tags:
        - Notices & Bulletins
      summary: Delete notice
      description: Removes notice record (Admin only).
      security:
        - tenantHeader: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Notice deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/notice:
    post:
      tags:
        - Notices & Bulletins
      summary: Create notice with file attachment
      description: Publishes a new announcement with optional PDF/image attachment (Admin only).
      security:
        - tenantHeader: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                  example: "Midterm Examination Schedule Released"
                content:
                  type: string
                  example: "Midterm examinations commence from September 15th. Check the timetable attached."
                noticeAttachment:
                  type: string
                  format: binary
      responses:
        '201':
          description: Notice created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/otp/send:
    post:
      tags:
        - Phone OTP
      summary: Send SMS OTP to phone
      description: Generates and sends OTP code to mobile phone via SMS gateway.
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/otp/verify:
    post:
      tags:
        - Phone OTP
      summary: Verify SMS OTP
      description: Validates SMS OTP for mobile number verification.
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Phone verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Invalid OTP

  /api/identity/otp/check-validation/{phone_number}:
    get:
      tags:
        - Phone OTP
      summary: Check phone verification status
      description: Checks if a mobile phone number has already been verified.
      security:
        - tenantHeader: []
      parameters:
        - in: path
          name: phone_number
          required: true
          schema:
            type: string
          example: "9876543210"
      responses:
        '200':
          description: Verification status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/payments/phonepe/webhook:
    get:
      tags:
        - PhonePe Payments
      summary: PhonePe webhook listener heartbeat
      description: Confirms webhook endpoint listener availability.
      security:
        - tenantHeader: []
      responses:
        '200':
          description: Listener is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
    post:
      tags:
        - PhonePe Payments
      summary: Ingest PhonePe S2S webhook callback
      description: Handles Server-to-Server asynchronous payment notification from PhonePe.
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/identity/payments/phonepe/webhook/config:
    get:
      tags:
        - PhonePe Payments
